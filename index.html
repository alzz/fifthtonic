<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20140%20140%22%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%2270%22%20r%3D%2264%22%20fill%3D%22none%22%20stroke%3D%22%232b9b84%22%20stroke-width%3D%225%22%20opacity%3D%22.5%22%2F%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%226%22%20r%3D%229%22%20fill%3D%22%232b9b84%22%2F%3E%3Cg%20transform%3D%22translate%2870%2C70%29%20scale%28.74%29%20translate%28-60%2C-60%29%22%3E%3Cpath%20d%3D%22M37.8%2C40%20L44%2C98%20Q45%2C104%2051%2C104%20L69%2C104%20Q75%2C104%2076%2C98%20L82.2%2C40%20Z%22%20fill%3D%22%232b9b84%22%20opacity%3D%22.25%22%2F%3E%3Cpath%20d%3D%22M36%2C22%20L44%2C98%20Q45%2C104%2051%2C104%20L69%2C104%20Q75%2C104%2076%2C98%20L84%2C22%22%20fill%3D%22none%22%20stroke%3D%22%232b9b84%22%20stroke-width%3D%228%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M32%2C22%20L88%2C22%22%20stroke%3D%22%232b9b84%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M63%2C80%20L84%2C18%22%20stroke%3D%22%232b9b84%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3Cellipse%20cx%3D%2255%22%20cy%3D%2284%22%20rx%3D%2211%22%20ry%3D%229%22%20fill%3D%22%232b9b84%22%20transform%3D%22rotate%28-20%2055%2084%29%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>Fifthtonic — find the key of a chord progression</title>
<style>
:root {
  --bg:      #fbfbfa;
  --fg:      #1a1a18;
  --muted:   #74746e;
  --hairline:#e0e0da;
  --field:   #ffffff;
  --accent:  #12695a;
  --bad:     #a32b1c;
  --radius:  6px;
}
/* System preference applies unless the reader has explicitly chosen light. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:      #16171a;
    --fg:      #e9e9e4;
    --muted:   #9a9a93;
    --hairline:#2e3034;
    --field:   #1e2024;
    --accent:  #63c9b0;
    --bad:     #e8836f;
  }
}
/* An explicit choice wins in both directions. */
:root[data-theme="dark"] {
    --bg:      #16171a;
    --fg:      #e9e9e4;
    --muted:   #9a9a93;
    --hairline:#2e3034;
    --field:   #1e2024;
    --accent:  #63c9b0;
    --bad:     #e8836f;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 4rem 1.25rem 6rem;
}
@media (max-width: 480px) { main { padding-top: 2.5rem; } }

/* ---- header: deliberately small. The input is the point, not the branding. */
.brand { display: flex; align-items: center; gap: .75rem; margin: 0 0 1.75rem; }

/* ---- theme toggle: the only control in the header, so it stays icon-sized */
.theme {
  margin-left: auto;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  color: var(--muted);
  background: none;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  cursor: pointer;
}
.theme:hover { color: var(--fg); border-color: var(--fg); }
/* The filled half swaps sides with the theme, so the control shows its state
   without needing a second icon. */
.theme svg { transition: transform .2s ease; }
.theme.is-dark svg { transform: rotate(180deg); }
@media (prefers-reduced-motion: reduce) { .theme svg { transition: none; } }
.theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 {
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: .02em;
  margin: 0 0 .1rem;
}
.tagline { color: var(--muted); font-size: .9rem; margin: 0; }

/* ---- logo: the twelve keys as a ring, the tonic picked out, a glass inside.
   Drawn entirely from the theme tokens so it follows light and dark, and so the
   page keeps to one accent colour. */
.logo { width: 46px; height: 46px; flex: none; }
.logo .ring   { fill: none; stroke: var(--fg); stroke-width: 4; opacity: .35; }
.logo .dot    { fill: var(--fg); opacity: .35; }
.logo .tonic  { fill: var(--accent); }
.logo .liquid { fill: var(--accent); opacity: .22; }
.logo .glass  { fill: none; stroke: var(--fg); stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
.logo .straw  { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; }
.logo .head   { fill: var(--accent); }

/* ---- input */
#chords {
  width: 100%;
  padding: .85rem 1rem;
  font: 500 1.35rem/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--fg);
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
}
#chords::placeholder { color: var(--muted); font-weight: 400; }
#chords:focus-visible, #capo:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .4rem;
  margin-top: .7rem;
}

/* ---- capo */
.capo { display: flex; align-items: center; gap: .45rem; font-size: .85rem; color: var(--muted); }
#capo {
  width: 3.6rem;
  padding: .3rem .45rem;
  font: 500 .95rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--fg);
  background: var(--field);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
}

/* ---- parsed chord chips */
.chips-label { font-size: .78rem; color: var(--muted); margin: 1.1rem 0 -.35rem; }
.chip {
  font: .8rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--muted);
  padding: .3rem .5rem;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  white-space: nowrap;
}
.chip b { color: var(--fg); font-weight: 600; }
.chip .to { color: var(--muted); }
.chip .sounds { color: var(--accent); font-weight: 600; }
.chip.bad { color: var(--bad); border-color: var(--bad); }
.parse-error { color: var(--bad); font-size: .85rem; margin: .5rem 0 0; }

/* ---- result: the one thing that dominates the page */
#result { margin-top: 3rem; }
#result:empty { margin-top: 0; }
.answer { animation: rise .18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .answer { animation: none; } }

.keyname {
  font-size: clamp(2.3rem, 11vw, 3.4rem);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -.02em;
  color: var(--accent);
  margin: 0;
}
.relative { color: var(--muted); font-size: .9rem; margin: .35rem 0 0; }
.relative b { color: var(--fg); font-weight: 600; }

.conf { margin-top: 1.5rem; }
.conf-text { font-size: .85rem; color: var(--muted); margin: 0; }
.conf-text b { color: var(--fg); font-weight: 600; }

.why { margin: 1.25rem 0 0; }
.ambiguous { color: var(--bad); }

/* ---- supporting detail, always visible */
.details { margin-top: 2.25rem; border-top: 1px solid var(--hairline); }
.details h2 {
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--muted);
  font-weight: 600;
  margin: 1.75rem 0 .6rem;
}
.alts-label { font-size: .78rem; color: var(--muted); margin: 1.6rem 0 .5rem; }
.alts { display: flex; gap: .4rem; list-style: none; padding: 0; margin: 0; }
.alts li { flex: 1; min-width: 0; }
.alts button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .1rem;
  width: 100%;
  padding: .4rem .3rem;
  font: inherit;
  color: inherit;
  background: none;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  cursor: pointer;
}
.alts button:hover { border-color: var(--fg); }
.alts button:hover .nm, .alts button:focus-visible .nm { color: var(--accent); }
.alts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.alts .nm {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .95rem;
  font-weight: 600;
}
.alts .pct { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.alts .tag { font-size: .66rem; color: var(--muted); }
.alts .pct { color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---- the key's own chord palette */
.grades {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
  gap: .4rem;
}
.dc {
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: .45rem .55rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.dc .num { display: block; font-size: .72rem; color: var(--muted); }
.dc .nm  { display: block; font-size: .98rem; font-weight: 600; margin-top: .1rem; }
/* The seventh sits under the triad it is built on, quieter: the same chord one
   note taller, not a different chord. */
.dc .sev { display: block; font-size: .76rem; color: var(--muted); margin-top: .15rem; }
.dc.extra { border-style: dashed; }

/* ---- scale steps */
/* Notes and gaps alternating, so the distance you read sits between the two
   notes it separates. Wraps on a narrow screen without splitting a pair. */
.steps {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: .1rem .3rem;
  margin: .5rem 0 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.steps .n { font-size: 1rem; font-weight: 600; }
.steps .s {
  font-size: .72rem;
  color: var(--accent);
  padding: 0 .1rem;
  font-variant-numeric: tabular-nums;
}
.patterns { width: auto; }
.patterns td.pat { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
/* One fixed-width cell per step, so the seven positions line up as columns down
   the table. Comparing the patterns is the whole reason they are stacked, and
   the wider 1½ would otherwise shift every symbol after it out of line. */
.patterns td.pat span { display: inline-block; width: 1.45em; text-align: center; }
.patterns tr.own td { color: var(--accent); font-weight: 600; }

/* ---- cadences */
.cadences { list-style: none; padding: 0; margin: .5rem 0 0; }
.cadences li { margin-top: .5rem; font-size: .88rem; }
.cadences .move {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 600;
}
.cadences .kind { color: var(--accent); }
.cadences .gloss { color: var(--muted); }

/* ---- circle of fifths */
/* Drawn at 380 and capped there: three rings of type do not survive being
   scaled down, and the innermost is the smallest to begin with. */
.cof { display: block; width: 100%; max-width: 380px; height: auto; margin: .4rem auto 0; }
.cof .ring, .cof .spoke { fill: none; stroke: var(--hairline); stroke-width: 1; }
.cof text {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  fill: var(--muted);
  text-anchor: middle;
  dominant-baseline: central;
}
.cof .maj { font-size: 15px; }
.cof .min { font-size: 11px; }
/* Innermost and smallest: the diminished ring is a detail of the two rings
   outside it, never the thing you read first. */
.cof .dim { font-size: 10px; }
.cof .in  { fill: var(--fg); }
/* The shaded arc is the key's whole chord supply. */
.cof .region { fill: var(--accent); opacity: .13; stroke: none; }
/* The parallel key's chords: outlined, not filled — available to borrow from,
   but not part of the key you are in. */
.cof .region-outline {
  fill: none;
  stroke: var(--fg);
  stroke-width: 1;
  stroke-dasharray: 4 4;
  opacity: .45;
}
.cof .alt { font-size: .78em; opacity: .7; }
.cof .deg { font-size: 9.5px; fill: var(--accent); }
/* Parallel-key degrees sit back, matching the dashed outline they belong to. */
.cof .deg.par { fill: var(--fg); opacity: .5; }
.cof .on  { fill: var(--accent); font-weight: 700; }
/* The ring around the tonic carries the same information as the colour, so the
   highlight survives a monochrome print or a colour-blind reader. */
.cof .mark { fill: none; stroke: var(--accent); stroke-width: 1.5; }
/* The parallel key is a landmark, not part of the answer — a plain outline,
   no accent, so it never competes with the tonic. */
.cof .mark.parallel { stroke: var(--fg); stroke-width: 1; opacity: .5; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .4rem .75rem .4rem 0; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
th { font-size: .78rem; font-weight: 600; color: var(--muted); }
td.sym, td.rn, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
td.out { color: var(--muted); }
tr.tonic td.sym { color: var(--accent); font-weight: 700; }

/* ---- modes ordered by brightness */
.bright {
  display: flex;
  flex-wrap: wrap;
  gap: .3rem;
  list-style: none;
  padding: 0;
  margin: .5rem 0 0;
}
.bright li {
  font: .78rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  padding: .3rem .45rem;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
}
.bright li.own { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.legend { font-size: .85rem; color: var(--muted); margin: .6rem 0 0; }
ul.legend { list-style: none; padding: 0; }
/* The wheel is the point; its key is for the first read only, so it starts
   folded away. */
.fold > summary {
  font-size: .85rem;
  color: var(--muted);
  cursor: pointer;
  padding: .5rem 0;
}
.fold > summary:hover { color: var(--fg); }
.fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fold ul.legend { margin-top: 0; }
ul.legend li { position: relative; padding-left: .95rem; margin-top: .3rem; }
ul.legend li::before { content: "—"; position: absolute; left: 0; opacity: .6; }
ul.legend b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<main>
  <header class="brand">
    <svg class="logo" viewBox="0 0 140 140" aria-hidden="true">
      <circle class="ring" cx="70" cy="70" r="64"/>
      <g class="dot">
        <circle cx="102" cy="14.6" r="5"/>
        <circle cx="125.4" cy="38" r="5"/>
        <circle cx="134" cy="70" r="5"/>
        <circle cx="125.4" cy="102" r="5"/>
        <circle cx="102" cy="125.4" r="5"/>
        <circle cx="70" cy="134" r="5"/>
        <circle cx="38" cy="125.4" r="5"/>
        <circle cx="14.6" cy="102" r="5"/>
        <circle cx="6" cy="70" r="5"/>
        <circle cx="14.6" cy="38" r="5"/>
        <circle cx="38" cy="14.6" r="5"/>
      </g>
      <circle class="tonic" cx="70" cy="6" r="7"/>
      <g transform="translate(70,70) scale(0.72) translate(-60,-60)">
        <path class="liquid" d="M37.8,40 L44,98 Q45,104 51,104 L69,104 Q75,104 76,98 L82.2,40 Z"/>
        <path class="glass" d="M36,22 L44,98 Q45,104 51,104 L69,104 Q75,104 76,98 L84,22"/>
        <path class="glass" d="M32,22 L88,22"/>
        <path class="straw" d="M63,80 L84,18"/>
        <ellipse class="head" cx="55" cy="84" rx="10" ry="8" transform="rotate(-20 55 84)"/>
      </g>
    </svg>
    <div>
      <h1>Fifthtonic</h1>
      <p class="tagline">Type a chord progression. Find the key.</p>
    </div>
    <button id="theme" class="theme" type="button"></button>
  </header>

  <input id="chords" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
         placeholder="C G Am F"
         aria-label="Chord progression, separated by spaces or commas">

  <div class="row">
    <label class="capo" for="capo">Capo
      <input id="capo" type="number" min="0" max="11" step="1" value="0"
             inputmode="numeric" autocomplete="off">
      fret
    </label>
  </div>

  <p class="chips-label" id="chips-label" hidden></p>
  <div class="row" id="chips"></div>
  <p class="parse-error" id="parse-error" hidden></p>

  <div id="result" aria-live="polite"></div>
</main>

<script id="theory">
/* =========================================================================
   THEORY MODULE — pure. No DOM access anywhere below this line.
   ========================================================================= */

const PC = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const LETTERS = ['C','D','E','F','G','A','B'];

const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

/* Key spellings. Conventional choices: F# major (not Gb), Eb minor over D# minor. */
const MAJOR_KEY_NAMES = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const MINOR_KEY_NAMES = ['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];

const MAJOR_SCALE = [0,2,4,5,7,9,11];
const NAT_MINOR   = [0,2,3,5,7,8,10];
/* A minor key is scored against the UNION of natural, harmonic and melodic minor.
   Treating them as three separate keys would triple-count the same tonic; a real
   piece in A minor moves freely between G and G#, F and F#. */
const MINOR_UNION = [0,2,3,5,7,8,9,10,11];

const MAJOR_TRIAD_DEGREES = [0,2,4,5,7,9];      // secondary-dominant targets
const MINOR_TRIAD_DEGREES = [0,3,5,7,8,10];

function mod12(n) { return ((n % 12) + 12) % 12; }

/* ---- chord parsing --------------------------------------------------- */

function parseRoot(str) {
  const m = str.match(/^[A-Ga-g]/);
  if (!m) return null;
  const letter = m[0].toUpperCase();
  let len = 1;
  let pc = PC[letter], name = letter;
  const acc = str.slice(len).match(/^(##|bb|x|[#b♯♭])/);
  if (acc) {
    const a = acc[0];
    if (a === '##' || a === 'x') { pc += 2; name += '##'; }
    else if (a === 'bb')         { pc -= 2; name += 'bb'; }
    else if (a === '#' || a === '♯') { pc += 1; name += '#'; }
    else                         { pc -= 1; name += 'b'; }
    len += a.length;
  }
  return { pc: mod12(pc), name, letter, len };
}

/* Returns intervals above the root, or null if the suffix is not understood. */
function parseSuffix(s) {
  let i = 0;
  const eat = (re) => { const m = s.slice(i).match(re); if (m) { i += m[0].length; return m[0]; } return null; };

  let third = 4, fifth = 7, seventh = null, sus = 0;
  let sixth = false, power = false, ext = 0, quality = 'major';
  const adds = [];

  /* --- triad. The (?!aj) guard on bare `m` stops maj7 being read as a minor
     chord followed by garbage. */
  if (eat(/^(dim|°)/))                 { quality = 'dim';   third = 3; fifth = 6; }
  else if (eat(/^(aug|\+)/))           { quality = 'aug';   fifth = 8; }
  else if (eat(/^sus2/))               { quality = 'sus';   sus = 2; }
  else if (eat(/^sus4?/))              { quality = 'sus';   sus = 4; }
  else if (eat(/^(min|mi|m|-)(?!aj)/)) { quality = 'minor'; third = 3; }

  /* --- major-seventh marker. A bare M or maj means "major triad"; only a
     following digit (or a lone Δ) makes it a major seventh. */
  let majFlag = false;
  if (eat(/^(maj|Maj|MAJ|ma|M)(?=6|7|9|11|13)/)) majFlag = true;
  else if (eat(/^[Δ∆]/)) majFlag = true;
  else eat(/^(maj|Maj|M)(?![A-Za-z0-9])/);

  /* --- sixth / seventh / extension */
  if (eat(/^6/)) { sixth = true; if (eat(/^\/?9/)) adds.push({ iv: 2, deg: 9 }); }
  else {
    const num = eat(/^(13|11|9|7)/);
    if (num) {
      ext = parseInt(num, 10);
      /* On a diminished triad, 7 means the diminished seventh (bb7 = 9 semitones). */
      seventh = majFlag ? 11 : (quality === 'dim' ? 9 : 10);
    } else if (majFlag) seventh = 11;
    else if (eat(/^5(?![0-9])/)) power = true;          // C5 — no third at all
  }

  /* --- adds, alterations and a trailing sus, in any order */
  let guard = 0;
  while (i < s.length && guard++ < 16) {
    const susL = eat(/^sus(2|4)?/);
    if (susL) { sus = susL === 'sus2' ? 2 : 4; continue; }
    const add = eat(/^add(13|11|9|6|4|2)/);
    if (add) {
      const d = parseInt(add.slice(3), 10);
      adds.push({ iv: { 2:2, 4:5, 6:9, 9:2, 11:5, 13:9 }[d], deg: d });
      continue;
    }
    const alt = eat(/^[#b♯♭](13|11|9|5)/);
    if (alt) {
      const sign = (alt[0] === '#' || alt[0] === '♯') ? 1 : -1;
      const deg = parseInt(alt.slice(1), 10);
      if (deg === 5) fifth = 7 + sign;
      else if (deg === 9)  adds.push({ iv: mod12(2 + sign), deg: 9 });
      else if (deg === 11) adds.push({ iv: mod12(5 + sign), deg: 11 });
      else adds.push({ iv: mod12(9 + sign), deg: 13 });
      continue;
    }
    if (eat(/^[()\s,]/)) continue;
    return null;                                        // unrecognised leftovers
  }

  /* Each tone is tagged with the scale degree it represents. Pitch class alone
     cannot tell Eb from D#; the degree can — a minor third is always some kind
     of third, so it takes the third letter above the root. */
  const tones = [{ iv: 0, deg: 1 }];
  if (power) tones.push({ iv: 7, deg: 5 });
  else {
    tones.push(sus ? (sus === 2 ? { iv: 2, deg: 2 } : { iv: 5, deg: 4 })
                   : { iv: third, deg: 3 });
    tones.push({ iv: fifth, deg: 5 });
  }
  if (sixth) tones.push({ iv: 9, deg: 6 });
  if (seventh !== null) tones.push({ iv: seventh, deg: 7 });
  /* Extensions imply the tones below them. 13th chords conventionally drop the
     11th, so 13 adds the 9th and 13th only. */
  if (ext >= 9)   tones.push({ iv: 2, deg: 9 });
  if (ext === 11) tones.push({ iv: 5, deg: 11 });
  if (ext >= 13)  tones.push({ iv: 9, deg: 13 });
  adds.forEach(a => tones.push(a));

  const seen = new Set();
  const uniq = tones.filter(t => {
    const k = mod12(t.iv);
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  return { intervals: uniq.map(t => mod12(t.iv)), tones: uniq,
           quality, third, fifth, seventh, sixth, sus, power, ext };
}

function parseChord(token) {
  const raw = token.trim();
  if (!raw) return null;
  let body = raw, bassStr = null;
  /* A slash means a bass note only when a note follows it. C6/9 is one chord
     name, not C6 over a bass of 9. */
  const slash = raw.indexOf('/');
  if (slash > 0 && /^[A-Ga-g]/.test(raw.slice(slash + 1))) {
    body = raw.slice(0, slash);
    bassStr = raw.slice(slash + 1);
  }

  const root = parseRoot(body);
  if (!root) return { raw, error: 'no recognisable root note' };
  const sfxText = body.slice(root.len);
  const sfx = parseSuffix(sfxText);
  if (!sfx) return { raw, error: 'unknown chord quality "' + sfxText + '"' };

  let bass = null;
  if (bassStr !== null) {
    const b = parseRoot(bassStr);
    if (!b || b.len !== bassStr.length) return { raw, error: 'bad bass note "' + bassStr + '"' };
    bass = b;
  }

  const pcs = sfx.intervals.map(iv => mod12(root.pc + iv));
  if (bass && !pcs.includes(bass.pc)) pcs.push(bass.pc);

  return { raw, sfxText, root, bass, pcs: [...new Set(pcs)], ...sfx };
}

/* Letter-based spelling, degree by degree: Cm is C Eb G, never C D# G. */
function chordNoteNames(ch) {
  const start = LETTERS.indexOf(ch.root.letter);
  let rootPc = PC[ch.root.letter];
  for (const c of ch.root.name.slice(1)) rootPc += (c === '#') ? 1 : -1;

  const names = ch.tones.map(t => {
    const letter = LETTERS[(start + (t.deg - 1) % 7) % 7];
    let diff = mod12(mod12(rootPc + t.iv) - PC[letter]);
    if (diff > 6) diff -= 12;
    return letter + (diff > 0 ? '#'.repeat(diff) : 'b'.repeat(-diff));
  });

  if (ch.bass && !ch.tones.some(t => mod12(ch.root.pc + t.iv) === ch.bass.pc)) {
    names.push(ch.bass.name);
  }
  return names;
}

/* ---- capo transposition ------------------------------------------------ */

/* Guitar-chart spelling: the names players actually see written above the staff
   on a lead sheet. Db and D# exist, but C#/Eb is what ends up on the page. */
const CAPO_NAMES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];

function respell(pc) {
  const name = CAPO_NAMES[mod12(pc)];
  return { pc: mod12(pc), name, letter: name[0], len: name.length };
}

/* A capo raises every string, so the shape you finger sounds `fret` semitones
   higher. The chord's interval structure is untouched — only its root moves. */
function transposeChord(ch, shift) {
  const root = respell(ch.root.pc + shift);
  const bass = ch.bass ? respell(ch.bass.pc + shift) : null;
  return Object.assign({}, ch, {
    root, bass,
    pcs: ch.pcs.map(p => mod12(p + shift)),
    raw: root.name + ch.sfxText + (bass ? '/' + bass.name : '')
  });
}

/* Names a pitch class the way the detected key would write it. CAPO_NAMES is
   only a first guess made before the key is known; once it is, the IV of Ab
   major must read Db, not C#. Anything outside the key falls back to flats,
   which is how borrowed chords (bVII, bVI, bIII) are almost always spelled. */
function keySpeller(tonic, mode) {
  const keyRoot = (mode === 'major' ? MAJOR_KEY_NAMES : MINOR_KEY_NAMES)[tonic];
  const steps = mode === 'major' ? MAJOR_SCALE : NAT_MINOR;
  const names = spellScale(keyRoot, steps);
  const map = {};
  steps.forEach((iv, i) => { map[mod12(tonic + iv)] = names[i]; });
  if (mode === 'minor') map[mod12(tonic + 11)] = spellScale(keyRoot, HARM_MINOR)[6];
  return (pc) => map[mod12(pc)] || FLAT_NAMES[mod12(pc)];
}

function respellChord(ch, spell) {
  const name = spell(ch.root.pc);
  ch.root = { pc: ch.root.pc, name, letter: name[0], len: name.length };
  if (ch.bass) {
    const b = spell(ch.bass.pc);
    ch.bass = { pc: ch.bass.pc, name: b, letter: b[0], len: b.length };
  }
  ch.raw = name + ch.sfxText + (ch.bass ? '/' + ch.bass.name : '');
}

/* ---- key scoring ------------------------------------------------------ */

function isDominant(ch)  { return ch.seventh === 10 && ch.quality === 'major' && !ch.sus; }
function isMajorish(ch)  { return ch.quality === 'major' && !ch.sus; }
function isMinorish(ch)  { return ch.quality === 'minor'; }
/* 7sus4 is a dominant by function and by ear, but it has no third, so it carries
   neither leading tone nor tritone. Worth counting, worth less than a real V7. */
function isSusDominant(ch) { return ch.seventh === 10 && ch.sus === 4; }

function scoreKey(chords, tonic, mode) {
  const allowed = new Set((mode === 'major' ? MAJOR_SCALE : MINOR_UNION).map(x => mod12(tonic + x)));
  const targets = mode === 'major' ? MAJOR_TRIAD_DEGREES : MINOR_TRIAD_DEGREES;
  let score = 0;
  const reasons = [];

  chords.forEach((ch, idx) => {
    const deg = mod12(ch.root.pc - tonic);
    const outside = ch.pcs.filter(p => !allowed.has(p)).length;
    const inside  = ch.pcs.length - outside;

    /* Membership, normalised by chord size so a 13th chord cannot outvote
       three triads simply by containing more notes. */
    score += 1.6 * (inside / ch.pcs.length);

    if (outside) {
      let penalty = 1.7 * outside;
      /* A dominant resolves DOWN a fifth, so the chord it points at sits five
         semitones above it, not seven. */
      const secondaryTarget = mod12(deg + 5);
      if (isMajorish(ch) && targets.includes(secondaryTarget) && secondaryTarget !== deg) {
        /* V/x — idiomatic, so mostly forgiven. But a plain major triad is far
           weaker evidence of a secondary dominant than an actual seventh chord:
           forgive it too readily and every key gains a free pass on any major
           triad a fifth above one of its degrees. */
        penalty *= isDominant(ch) ? 0.25 : 0.55;
      } else if (mode === 'major' && [10, 5, 8, 3].includes(deg)) {
        penalty *= 0.35;                                  // bVII, iv, bVI, bIII — modal mixture
      } else if (mode === 'minor' && deg === 0 && isMajorish(ch)) {
        penalty *= 0.35;                                  // Picardy third
      }
      score -= penalty;
    }

    /* Functional evidence. The dominant seventh is the strongest single signal
       a key has: it contains both the leading tone and the tritone that only
       resolves one way. */
    if (deg === 7 && isDominant(ch)) { score += 3.0; reasons.push({ kind: 'V7', chord: ch }); }
    else if (deg === 7 && isSusDominant(ch)) { score += 2.0; reasons.push({ kind: 'V7sus', chord: ch }); }
    else if (deg === 7 && isMajorish(ch)) {
      score += mode === 'major' ? 1.0 : 1.8;              // in minor this is the raised leading tone
      reasons.push({ kind: 'V', chord: ch });
    }
    else if (deg === 7 && isMinorish(ch) && mode === 'minor') score += 0.5;
    else if (deg === 10 && isMajorish(ch) && mode === 'minor') score += 0.3;
    else if (deg === 11 && (ch.quality === 'dim' || (isMinorish(ch) && ch.pcs.includes(mod12(tonic + 5))))) {
      score += 1.2; reasons.push({ kind: 'vii', chord: ch });
    }

    const tonicChord = deg === 0 && (mode === 'major' ? isMajorish(ch) : isMinorish(ch));
    if (tonicChord && idx === 0) { score += 1.5; reasons.push({ kind: 'first', chord: ch }); }
    if (tonicChord && idx === chords.length - 1) { score += 1.8; reasons.push({ kind: 'last', chord: ch }); }

    /* ii-V-I and V-I motion */
    if (idx >= 1) {
      const prev = mod12(chords[idx - 1].root.pc - tonic);
      if (deg === 0 && prev === 7 && tonicChord) {
        score += 1.0;
        if (idx >= 2 && mod12(chords[idx - 2].root.pc - tonic) === 2 && isMinorish(chords[idx - 2])) {
          score += 1.5; reasons.push({ kind: 'ii-V-I', chord: ch });
        }
      }
    }
  });

  return { tonic, mode, score, reasons };
}

function analyze(input, capo) {
  const shift = mod12(capo || 0);
  const tokens = String(input).split(/[\s,|]+/).filter(Boolean);
  const parsed = tokens.map(t => {
    const ch = parseChord(t);
    if (ch && !ch.error) ch.sounding = shift ? transposeChord(ch, shift) : ch;
    return ch;
  });
  /* Everything downstream analyses what is actually heard, not what is fingered. */
  const chords = parsed.filter(c => c && !c.error).map(c => c.sounding);
  if (!chords.length) return { parsed, chords: [], candidates: [], ok: false, capo: shift };

  const candidates = [];
  for (let t = 0; t < 12; t++) {
    candidates.push(scoreKey(chords, t, 'major'));
    candidates.push(scoreKey(chords, t, 'minor'));
  }

  /* Softmax over all 24 keys. Temperature is deliberately warm: when two keys
     genuinely fit (the relative major/minor problem) the app should say so
     rather than manufacture certainty. */
  const T = 1.5;
  const max = Math.max(...candidates.map(c => c.score));
  let sum = 0;
  candidates.forEach(c => { c.exp = Math.exp((c.score - max) / T); sum += c.exp; });
  candidates.forEach(c => { c.confidence = c.exp / sum; });
  candidates.sort((a, b) => b.confidence - a.confidence);

  const top = candidates[0];
  const ambiguous = candidates[1] && (top.confidence - candidates[1].confidence) < 0.08;

  /* Now that the key is known, the transposed chords can be spelled in it. */
  if (shift) {
    const spell = keySpeller(top.tonic, top.mode);
    chords.forEach(ch => respellChord(ch, spell));
  }

  return {
    parsed, chords, candidates,
    ok: true,
    capo: shift,
    top,
    ambiguous,
    romans: romanAnalysis(chords, top.tonic, top.mode),
    cadences: cadences(chords, top.tonic, top.mode),
    modal: modalReading(chords, top.tonic, top.mode),
    explanation: explain(chords, top, candidates[1], ambiguous)
  };
}

/* ---- naming ----------------------------------------------------------- */

/* Chart shorthand: F, Am — what a player writes above a stave. */
function shortKeyName(tonic, mode) {
  return mode === 'major' ? MAJOR_KEY_NAMES[tonic] : MINOR_KEY_NAMES[tonic] + 'm';
}

function keyName(tonic, mode) {
  return (mode === 'major' ? MAJOR_KEY_NAMES : MINOR_KEY_NAMES)[tonic] +
         (mode === 'major' ? ' major' : ' minor');
}

function noteName(pc, useFlats) {
  return (useFlats ? FLAT_NAMES : SHARP_NAMES)[pc];
}

/* Letter-based scale spelling: one letter per degree, accidental derived from
   the gap. This is what makes Bb major read Bb C D Eb F G A and not A# C D... */
function spellScale(tonicName, intervals) {
  const start = LETTERS.indexOf(tonicName[0]);
  let tonicPc = PC[tonicName[0]];
  for (const c of tonicName.slice(1)) tonicPc += (c === '#') ? 1 : -1;
  return intervals.map((iv, i) => {
    const letter = LETTERS[(start + i) % 7];
    let diff = mod12(mod12(tonicPc + iv) - PC[letter]);
    if (diff > 6) diff -= 12;
    return letter + (diff > 0 ? '#'.repeat(diff) : 'b'.repeat(-diff));
  });
}

const SHARP_ORDER = ['F','C','G','D','A','E','B'];
const FLAT_ORDER  = ['B','E','A','D','G','C','F'];
const MAJOR_FIFTHS = { C:0, G:1, D:2, A:3, E:4, B:5, 'F#':6, 'C#':7, F:-1, Bb:-2, Eb:-3, Ab:-4, Db:-5, Gb:-6, Cb:-7 };
/* Spelled explicitly rather than derived: Eb minor's relative is Gb major
   (6 flats), not F# major (6 sharps), and pitch class alone cannot tell them apart. */
const MINOR_REL_MAJOR = ['Eb','E','F','Gb','G','Ab','A','Bb','B','C','Db','D'];

function keySignature(tonic, mode) {
  const rootName = mode === 'major' ? MAJOR_KEY_NAMES[tonic] : MINOR_REL_MAJOR[tonic];
  const n = MAJOR_FIFTHS[rootName];
  if (n === undefined) return { count: 0, text: '—', notes: [] };
  if (n === 0) return { count: 0, text: 'no sharps or flats', notes: [] };
  const notes = (n > 0 ? SHARP_ORDER.slice(0, n).map(x => x + '#') : FLAT_ORDER.slice(0, -n).map(x => x + 'b'));
  const word = Math.abs(n) === 1 ? (n > 0 ? 'sharp' : 'flat') : (n > 0 ? 'sharps' : 'flats');
  return { count: n, text: Math.abs(n) + ' ' + word, notes };
}

/* ---- scale steps ------------------------------------------------------- */

/* A scale is its gaps, not its notes: the same T T ½ T T T ½ starting anywhere
   gives a major scale. Written as it is taught — T for a whole tone, ½ for a
   semitone. The tone-and-a-half only turns up in the harmonic minor, between the
   flat sixth and the raised seventh, and that outsized gap is exactly what makes
   it sound the way it does. */
const STEP_SYMBOL = { 1: '½', 2: 'T', 3: '1½' };

const MELODIC_MINOR = [0,2,3,5,7,9,11];

function scaleSteps(tonicName, intervals) {
  const notes = spellScale(tonicName, intervals);
  /* The last gap closes the octave, so it is measured against 12, not against a
     note the list does not contain. */
  const steps = intervals.map((iv, i) =>
    STEP_SYMBOL[(i === intervals.length - 1 ? 12 : intervals[i + 1]) - iv]);
  return { notes: notes.concat(notes[0]), steps };
}

/* The four patterns worth having side by side: one major, and the three forms a
   minor key moves between. All spelled from the same tonic, which is the point —
   one starting note, four sets of gaps, four scales. Remote keys pay for that
   honestly: Db minor really does need a Bbb. */
function scalePatterns(tonicName) {
  return [
    { name: 'major',          intervals: MAJOR_SCALE },
    { name: 'natural minor',  intervals: NAT_MINOR },
    { name: 'harmonic minor', intervals: HARM_MINOR },
    { name: 'melodic minor',  intervals: MELODIC_MINOR }
  ].map(p => {
    const s = scaleSteps(tonicName, p.intervals);
    return { name: p.name, steps: s.steps, notes: s.notes.slice(0, 7) };
  });
}

/* ---- the diatonic chords of a key ------------------------------------- */

const MAJOR_DEGREE_RN = ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'];
const MINOR_DEGREE_RN = ['i', 'ii°', 'III', 'iv', 'v', 'VI', 'VII'];
const HARM_MINOR = [0,2,3,5,7,8,11];

/* Triad suffix and seventh-chord suffix for one stack of thirds, from the
   intervals alone. The seventh is where the diminished family splits: a half
   diminished (m7b5) has a minor seventh over the flat fifth and is what the vii
   of a major key really is; a full diminished seventh stacks another minor third
   and only occurs on the raised seventh of a minor key. */
function stackNames(third, fifth, seventh) {
  let triad = '', sev = '';
  if (third === 3 && fifth === 6) { triad = 'dim'; sev = seventh === 9 ? 'dim7' : 'm7b5'; }
  else if (third === 3)           { triad = 'm';   sev = seventh === 11 ? 'mmaj7' : 'm7'; }
  else if (fifth === 8)           { triad = 'aug'; sev = seventh === 11 ? 'maj7#5' : '7#5'; }
  else                            { triad = '';    sev = seventh === 11 ? 'maj7' : '7'; }
  return { triad, sev };
}

/* Roman-numeral figure for the seventh, matching stackNames. */
function stackFigure(third, fifth, seventh) {
  if (third === 3 && fifth === 6) return seventh === 9 ? '°7' : 'ø7';
  if (third === 3)                return seventh === 11 ? 'maj7' : '7';
  if (fifth === 8)                return seventh === 11 ? 'maj7' : '7';
  return seventh === 11 ? 'maj7' : '7';
}

/* Every chord the key builds on its own scale, spelled properly and named by
   degree — the triad and the seventh above it. Qualities are derived from the
   scale rather than hardcoded, so the same code serves major and minor. */
function diatonicChords(tonic, mode) {
  const keyRoot = (mode === 'major' ? MAJOR_KEY_NAMES : MINOR_KEY_NAMES)[tonic];
  const steps = mode === 'major' ? MAJOR_SCALE : NAT_MINOR;
  const names = spellScale(keyRoot, steps);
  const rns = mode === 'major' ? MAJOR_DEGREE_RN : MINOR_DEGREE_RN;

  const out = [];
  for (let i = 0; i < 7; i++) {
    const root = mod12(tonic + steps[i]);
    const third   = mod12(mod12(tonic + steps[(i + 2) % 7]) - root);
    const fifth   = mod12(mod12(tonic + steps[(i + 4) % 7]) - root);
    const seventh = mod12(mod12(tonic + steps[(i + 6) % 7]) - root);
    const s = stackNames(third, fifth, seventh);
    out.push({
      roman: rns[i], name: names[i] + s.triad, rootPc: root, extra: false,
      roman7: rns[i].replace('°', '') + stackFigure(third, fifth, seventh),
      name7: names[i] + s.sev
    });
  }

  /* A minor key has no real dominant until the seventh degree is raised, and
     nearly all minor-key music does raise it. Show both. */
  if (mode === 'minor') {
    const har = spellScale(keyRoot, HARM_MINOR);
    out.push({ roman: 'V', name: har[4], rootPc: mod12(tonic + 7), extra: true,
               roman7: 'V7', name7: har[4] + '7' });
    /* The raised seventh is the one place a full diminished seventh belongs. */
    out.push({ roman: 'vii°', name: har[6] + 'dim', rootPc: mod12(tonic + 11), extra: true,
               roman7: 'vii°7', name7: har[6] + 'dim7' });
  }
  return out;
}

/* Indices into diatonicChords(). Major returns 7 entries (I..vii°); minor
   returns 9, the natural-minor seven plus the raised V and vii°. */
const FUNCTION_GROUPS = {
  major: [
    { name: 'Tonic',       idx: [0, 2, 5] },        // I, iii, vi
    { name: 'Subdominant', idx: [1, 3] },           // ii, IV
    { name: 'Dominant',    idx: [4, 6] }            // V, vii°
  ],
  minor: [
    { name: 'Tonic',       idx: [0, 2, 5] },        // i, III, VI
    { name: 'Subdominant', idx: [1, 3] },           // ii°, iv
    { name: 'Dominant',    idx: [4, 6, 7, 8] }      // v, VII, and the raised V, vii°
  ]
};

function harmonicFunctions(tonic, mode) {
  const chords = diatonicChords(tonic, mode);
  return FUNCTION_GROUPS[mode].map(g => ({
    name: g.name,
    chords: g.idx.map(i => chords[i]).filter(Boolean)
  }));
}

/* ---- circle of fifths -------------------------------------------------- */

/* Twelve spokes, each a perfect fifth clockwise from the last: C G D A E B F#
   Db Ab Eb Bb F. The relative minor rides the same spoke as its major, which is
   exactly why the two are so easy to confuse. */
/* At the foot of the wheel the sharp and flat sides meet, and the same three
   spokes carry two names apiece. Both are correct — which one you write depends
   on which direction you arrived from. */
const ENHARMONIC_MAJOR = { 11: 'Cb', 6: 'Gb', 1: 'C#' };
const ENHARMONIC_MINOR = { 8: 'Abm', 3: 'D#m', 10: 'A#m' };

/* The third name on a spoke: the diminished triad on the leading tone. It is the
   major key's vii° and, read from the ring above it, the relative minor's ii° —
   one chord serving both, which is why it belongs on their shared spoke rather
   than on a spoke of its own. Spelled from the parent scale, so C# major gives
   B#° and Db major gives C°. */
function seventhDegreeDim(majorName) {
  return spellScale(majorName, MAJOR_SCALE)[6] + '°';
}

function circleOfFifths() {
  const spokes = [];
  for (let i = 0; i < 12; i++) {
    const pc = mod12(i * 7), rel = mod12(pc + 9);
    const majAlt = ENHARMONIC_MAJOR[pc] || null;
    spokes.push({
      angle: i * 30,
      majorPc: pc,  major: MAJOR_KEY_NAMES[pc],         majorAlt: majAlt,
      minorPc: rel, minor: MINOR_KEY_NAMES[rel] + 'm',  minorAlt: ENHARMONIC_MINOR[rel] || null,
      dimPc: mod12(pc + 11),
      dim: seventhDegreeDim(MAJOR_KEY_NAMES[pc]),
      dimAlt: majAlt ? seventhDegreeDim(majAlt) : null
    });
  }
  return spokes;
}

/* ---- modes ------------------------------------------------------------- */

const MODE_NAMES = ['Ionian', 'Dorian', 'Phrygian', 'Lydian', 'Mixolydian', 'Aeolian', 'Locrian'];

/* Modes ranked by brightness. Each step raises exactly one scale degree by a
   semitone, so the order is also a walk clockwise round the circle of fifths:
   Locrian has the most flattened degrees, Lydian the most raised. */
const MODE_BRIGHTNESS = ['Locrian', 'Phrygian', 'Aeolian', 'Dorian', 'Mixolydian', 'Ionian', 'Lydian'];

/* Where each mode starts inside its parent major scale, in semitones. A Dorian
   sits two semitones above G, so G major is the scale it is drawn from — and G
   major's key signature is the one a player actually needs. */
const MODE_OFFSET = {
  Ionian: 0, Dorian: 2, Phrygian: 4, Lydian: 5, Mixolydian: 7, Aeolian: 9, Locrian: 11
};

const MODE_STEPS = {
  Ionian:     [0,2,4,5,7,9,11],
  Dorian:     [0,2,3,5,7,9,10],
  Phrygian:   [0,1,3,5,7,8,10],
  Lydian:     [0,2,4,6,7,9,11],
  Mixolydian: [0,2,4,5,7,9,10],
  Aeolian:    [0,2,3,5,7,8,10],
  Locrian:    [0,1,3,5,6,8,10]
};

/* One note tells you which mode you are in. The bright modes are heard against
   the major scale, the dark ones against the natural minor, and Ionian and
   Aeolian are those two references themselves — so they have no colour of their
   own to name. */
const MODE_COLOUR = {
  Ionian:     null,
  Dorian:     { deg: 6, sym: '♮6', vs: 'minor' },
  Phrygian:   { deg: 2, sym: '♭2', vs: 'minor' },
  Lydian:     { deg: 4, sym: '♯4', vs: 'major' },
  Mixolydian: { deg: 7, sym: '♭7', vs: 'major' },
  Aeolian:    null,
  Locrian:    { deg: 5, sym: '♭5', vs: 'minor' }
};

/* Seven notes, seven modes — the same collection heard from seven different
   home notes. A major key starts on Ionian; a minor key is Aeolian, which is
   the sixth mode, so its degrees are offset by five. */
function modesOfKey(tonic, mode) {
  const keyRoot = (mode === 'major' ? MAJOR_KEY_NAMES : MINOR_KEY_NAMES)[tonic];
  const names = spellScale(keyRoot, mode === 'major' ? MAJOR_SCALE : NAT_MINOR);
  const offset = mode === 'major' ? 0 : 5;
  return names.map((root, i) => {
    const m = MODE_NAMES[(offset + i) % 7];
    const notes = names.slice(i).concat(names.slice(0, i));
    const col = MODE_COLOUR[m];
    return { root, mode: m, notes, colour: col ? col.sym + ' ' + notes[col.deg - 1] : null };
  });
}

/* The detected key names a tonic and a mode, but the notes actually played may
   spell a different mode on that same tonic — G major with every F natural is
   G Mixolydian, and calling the F a borrowed bVII misses the point.

   Claimed only when some mode accounts for every note and the plain major or
   minor does not, so C G Am F stays C major and is never made more exotic than
   it is. Nearest neighbours are tried first: one altered degree before two. */
function modalReading(chords, tonic, mode) {
  const used = new Set();
  chords.forEach(ch => ch.pcs.forEach(p => used.add(mod12(p - tonic))));
  const home = mode === 'major' ? 'Ionian' : 'Aeolian';
  const fits = (name) => [...used].every(iv => MODE_STEPS[name].includes(iv));
  if (fits(home)) return null;

  const order = mode === 'major'
    ? ['Mixolydian', 'Lydian', 'Dorian', 'Aeolian', 'Phrygian', 'Locrian']
    : ['Dorian', 'Phrygian', 'Mixolydian', 'Ionian', 'Lydian', 'Locrian'];
  const found = order.find(fits);
  if (!found) return null;

  const keyRoot = (mode === 'major' ? MAJOR_KEY_NAMES : MINOR_KEY_NAMES)[tonic];
  const notes = spellScale(keyRoot, MODE_STEPS[found]);
  const col = MODE_COLOUR[found];
  return {
    mode: found,
    name: keyRoot + ' ' + found,
    colour: col ? col.sym + ' (' + notes[col.deg - 1] + ')' : null,
    /* The mode's own signature, which is not the detected key's: A minor writes
       no accidentals, A Dorian writes one sharp. */
    signature: keySignature(mod12(tonic - MODE_OFFSET[found]), 'major')
  };
}

/* ---- roman numeral analysis ------------------------------------------- */

const MAJOR_RN = { 0:'I', 1:'bII', 2:'II', 3:'bIII', 4:'III', 5:'IV', 6:'#IV', 7:'V', 8:'bVI', 9:'VI', 10:'bVII', 11:'VII' };
const MINOR_RN = { 0:'I', 1:'bII', 2:'II', 3:'III', 4:'#III', 5:'IV', 6:'#IV', 7:'V', 8:'VI', 9:'#VI', 10:'VII', 11:'VII' };

function chordFigure(ch) {
  let f = '';
  if (ch.quality === 'dim') f += ch.seventh === 9 ? '°7' : '°';
  else if (ch.quality === 'aug') f += '+';
  else if (ch.quality === 'minor' && ch.fifth === 6 && ch.seventh === 10) f += 'ø7';
  if (!f) {
    /* Height first, suspension after: a dominant seventh with a suspended fourth
       is written V7sus4, never Vsus47. */
    if (ch.sixth) f += ch.tones.some(t => t.deg === 9) ? '6/9' : '6';
    else if (ch.seventh === 11) f += 'maj' + (ch.ext > 7 ? ch.ext : 7);
    else if (ch.seventh === 10) f += ch.ext > 7 ? String(ch.ext) : '7';
    if (ch.sus) f += 'sus' + ch.sus;
    if (ch.power) f += '5';
  }
  return f;
}

/* Figured bass: which member of the chord is underneath it. The numbers are the
   intervals a continuo player would have read, and they are why a second
   inversion looks nothing like a first. */
const INVERSION = {
  3: { triad: '⁶',  seventh: '⁶₅', name: 'first inversion' },
  5: { triad: '⁶₄', seventh: '⁴₃', name: 'second inversion' },
  7: { triad: null, seventh: '⁴₂', name: 'third inversion' }
};

function inversionOf(ch) {
  if (!ch.bass || ch.bass.pc === ch.root.pc) return null;
  const iv = mod12(ch.bass.pc - ch.root.pc);
  const tone = ch.tones.find(t => mod12(t.iv) === iv);
  /* A bass note that is not in the chord at all is a pedal or a passing bass,
     not an inversion. Say so rather than inventing a figure for it. */
  if (!tone) return { figure: null, name: 'bass outside the chord' };
  const inv = INVERSION[tone.deg];
  if (!inv) return { figure: null, name: 'the ' + tone.deg + 'th in the bass' };
  return { figure: ch.seventh !== null ? inv.seventh : inv.triad, name: inv.name };
}

function romanAnalysis(chords, tonic, mode) {
  const allowed = new Set((mode === 'major' ? MAJOR_SCALE : MINOR_UNION).map(x => mod12(tonic + x)));
  const map = mode === 'major' ? MAJOR_RN : MINOR_RN;
  const targets = mode === 'major' ? MAJOR_TRIAD_DEGREES : MINOR_TRIAD_DEGREES;

  return chords.map(ch => {
    const deg = mod12(ch.root.pc - tonic);
    const outside = ch.pcs.some(p => !allowed.has(p));
    const minorish = ch.quality === 'minor' || ch.quality === 'dim';
    /* Case carries the quality: uppercase major, lowercase minor. Only the
       numeral letters change — a bIII stays flat when it becomes biii. */
    let rn = map[deg];
    if (minorish) rn = rn.replace(/[IV]+/, m => m.toLowerCase());
    /* MINOR_RN gives both sevenths the numeral VII, because the leading-tone
       chord is written vii° with the raise understood. Anything else built on the
       raised seventh has to say so, or it reads as the natural VII. */
    if (mode === 'minor' && deg === 11 && ch.quality !== 'dim') rn = '#' + rn;
    rn += chordFigure(ch);

    /* A non-diatonic major/dominant chord a fifth above a diatonic degree is a
       secondary dominant, not an anomaly. Label it as such. */
    let note = outside ? 'borrowed' : 'diatonic';
    if (outside && (isMajorish(ch) || isSusDominant(ch))) {
      const target = mod12(deg + 5);
      if (targets.includes(target) && target !== deg) {
        const targetMinor = mode === 'major' ? [2,4,9].includes(target) : [0,5,7].includes(target);
        let t = map[target];
        if (targetMinor) t = t.replace(/[IV]+/, m => m.toLowerCase());
        rn = ((isDominant(ch) || isSusDominant(ch)) ? 'V7/' : 'V/') + t;
        note = 'secondary dominant';
      }
    }

    /* Last, so it survives being relabelled as a secondary dominant. */
    const inv = inversionOf(ch);
    if (inv) {
      if (inv.figure) rn += inv.figure;
      note += ' · ' + inv.name;
    }
    return { chord: ch, roman: rn, note, outside, inversion: inv };
  });
}

/* ---- cadences ---------------------------------------------------------- */

/* A cadence is a pair of chords, never one: what establishes a key is the motion
   between them. These five are the ones that carry the weight in tonal music. */
const CADENCE_GLOSS = {
  'perfect':       'the dominant resolving home, the strongest close there is',
  'plagal':        'the subdominant falling home, with no leading tone to push it',
  'interrupted':   'the dominant turning to the sixth instead of home',
  'half':          'coming to rest on the dominant, leaving the phrase open',
  'Phrygian half': 'the minor subdominant stepping down onto the dominant'
};

function cadences(chords, tonic, mode) {
  const deg = (ch) => mod12(ch.root.pc - tonic);
  const home = (ch) => deg(ch) === 0 && (isMajorish(ch) || isMinorish(ch));
  const dom  = (ch) => deg(ch) === 7 && (isMajorish(ch) || isDominant(ch) || isSusDominant(ch));
  const out = [];

  for (let i = 1; i < chords.length; i++) {
    const from = chords[i - 1], to = chords[i];
    const a = deg(from), b = deg(to);
    const last = i === chords.length - 1;
    let name = null;

    if (a === 7 && home(to)) {
      name = 'perfect';
      /* The supertonic preparation is what makes a perfect cadence inevitable
         rather than merely correct. */
      const two = i >= 2 ? chords[i - 2] : null;
      if (two && mod12(two.root.pc - tonic) === 2 &&
          (isMinorish(two) || two.quality === 'dim')) name = 'perfect, prepared by ii';
    }
    else if (a === 5 && home(to))                           name = 'plagal';
    else if (a === 7 && b === (mode === 'major' ? 9 : 8))    name = 'interrupted';
    else if (mode === 'minor' && a === 5 && dom(to) && last) name = 'Phrygian half';
    else if (dom(to) && last)                               name = 'half';

    if (name) {
      out.push({ at: i, name, from: from.raw, to: to.raw,
                 gloss: CADENCE_GLOSS[name.replace(/,.*$/, '')] });
    }
  }
  return out;
}

/* ---- plain-language explanation --------------------------------------- */

function explain(chords, top, runnerUp, ambiguous) {
  const key = keyName(top.tonic, top.mode);
  const useFlats = (top.mode === 'major' ? MAJOR_KEY_NAMES : MINOR_KEY_NAMES)[top.tonic].includes('b');
  const v7 = top.reasons.find(r => r.kind === 'V7');
  const v7sus = top.reasons.find(r => r.kind === 'V7sus');
  const vii = top.reasons.find(r => r.kind === 'vii');
  const v = top.reasons.find(r => r.kind === 'V');
  const iivi = top.reasons.find(r => r.kind === 'ii-V-I');
  const last = top.reasons.find(r => r.kind === 'last');
  const lead = noteName(mod12(top.tonic + 11), useFlats);
  const tonicNote = noteName(top.tonic, useFlats);

  const allowed = new Set((top.mode === 'major' ? MAJOR_SCALE : MINOR_UNION).map(x => mod12(top.tonic + x)));
  const fits = chords.filter(ch => ch.pcs.every(p => allowed.has(p))).length;
  const allFit = fits === chords.length;

  let why;
  if (iivi) {
    why = iivi.chord.raw + ' completes a ii–V–I cadence in ' + key + ', the strongest signal a key can give.';
  } else if (v7) {
    why = v7.chord.raw + ' is the dominant seventh of ' + key + ': it contains ' + lead +
          ', the leading tone, and a tritone that resolves onto ' + tonicNote + '.';
  } else if (v7sus) {
    why = v7sus.chord.raw + ' stands on the dominant of ' + key + ': no third, so no ' +
          'leading tone, but its seventh still pulls home.';
  } else if (v && top.mode === 'minor') {
    why = v.chord.raw + ' raises the seventh degree to ' + lead + ', which only happens in ' + key + '.';
  } else if (last) {
    why = (allFit ? 'Every chord fits ' + key
                  : fits + ' of ' + chords.length + ' chords fit ' + key) +
          ', and the progression comes to rest on ' + last.chord.raw + '.';
  } else if (vii) {
    why = vii.chord.raw + ' is the leading-tone chord of ' + key + ', pulling towards ' + tonicNote + '.';
  } else if (v) {
    why = 'The chords fit ' + key + ', and ' + v.chord.raw + ' acts as its dominant.';
  } else {
    why = (allFit ? 'All ' + chords.length : fits + ' of ' + chords.length) +
          ' chords are diatonic to ' + key + '.';
  }

  if (ambiguous && runnerUp) {
    why += ' This is genuinely ambiguous, though — it could just as easily be ' +
           keyName(runnerUp.tonic, runnerUp.mode) + '.';
  }
  return why;
}

/* Re-reads the same progression as if a different candidate were the key. The
   evidence does not change — only which key we are reading it against. */
function describe(r, tonic, mode) {
  const t = r.candidates.find(c => c.tonic === tonic && c.mode === mode) || r.candidates[0];
  const isTop = t === r.candidates[0];
  /* With a capo, the sounding chords were spelled for the detected key; a
     different key spells them differently. */
  if (r.capo) {
    const spell = keySpeller(t.tonic, t.mode);
    r.chords.forEach(ch => respellChord(ch, spell));
  }
  return {
    top: t,
    picked: !isTop,
    ambiguous: isTop && r.ambiguous,
    romans: romanAnalysis(r.chords, t.tonic, t.mode),
    cadences: cadences(r.chords, t.tonic, t.mode),
    modal: modalReading(r.chords, t.tonic, t.mode),
    explanation: explain(r.chords, t, r.candidates[1], isTop && r.ambiguous)
  };
}

function confidenceWord(p, ambiguous) {
  if (ambiguous) return 'ambiguous';
  if (p >= 0.65) return 'strong evidence';
  if (p >= 0.40) return 'likely';
  if (p >= 0.25) return 'weak evidence';
  return 'ambiguous';
}

/* ---- self-tests -------------------------------------------------------- */

function selfTest(report) {
  const cases = [
    ['C G Am F',        'C major'],
    ['G C D G',         'Bb major', 3],     // capo 3: G shapes sound in Bb
    ['Am Dm E7 Am',     'C minor',  3],
    ['E A B7',          'G major',  3],
    ['Am Dm E7 Am',     'A minor'],
    ['Bb Eb F7 Bb',     'Bb major'],
    ['Bm E7 Bm',        'B minor'],
    ['Dm7 G7 Cmaj7',    'C major'],
    ['E A B7',          'E major'],
    ['Cm Ab Eb Bb',     'C minor'],
    ['D G A D',         'D major'],
    ['F#m Bm E A',      'A major'],
    ['G C D G',         'G major'],
    ['Em Am B7 Em',     'E minor'],
    ['F Bb C7 F',       'F major'],
    ['C F G C',         'C major'],
    ['Ab Db Eb7 Ab',    'Ab major']
  ];
  let pass = 0;
  const lines = [];
  for (const [input, expected, capo] of cases) {
    const r = analyze(input, capo);
    const got = r.ok ? keyName(r.top.tonic, r.top.mode) : 'PARSE FAIL';
    const ok = got === expected;
    if (ok) pass++;
    lines.push((ok ? 'pass' : 'FAIL') + '  ' + (input + (capo ? ' [capo ' + capo + ']' : '')).padEnd(26) + ' → ' + got +
               (ok ? '' : '   (expected ' + expected + ')'));
  }
  /* Parser must survive garbage without taking the whole analysis down. */
  const junk = analyze('C Hm7 G');
  const junkOk = junk.ok && junk.parsed.some(p => p.error) && junk.chords.length === 2;
  if (junkOk) pass++;
  lines.push((junkOk ? 'pass' : 'FAIL') + '  bad-token recovery');

  /* Every spoke's inner name must be the diminished chord the major above it and
     the minor beside it both own — its root a semitone under the major's. */
  const spokes = circleOfFifths();
  const ringOk = spokes.every(sp => {
    const vii = diatonicChords(sp.majorPc, 'major')[6];
    const ii  = diatonicChords(sp.minorPc, 'minor')[1];
    return sp.dimPc === vii.rootPc && sp.dimPc === ii.rootPc &&
           sp.dim === vii.name.replace('dim', '°');
  });
  if (ringOk) pass++;
  lines.push((ringOk ? 'pass' : 'FAIL') + '  diminished ring is vii° / ii°');

  /* The diminished family splits at the seventh: half diminished on the vii of a
     major key, fully diminished only on the raised seventh of a minor one. */
  const cMaj = diatonicChords(0, 'major'), aMin = diatonicChords(9, 'minor');
  const sevOk = cMaj[6].name7 === 'Bm7b5' && cMaj[6].roman7 === 'viiø7' &&
                cMaj[4].name7 === 'G7'    && cMaj[0].name7  === 'Cmaj7' &&
                aMin[1].name7 === 'Bm7b5' && aMin[8].name7  === 'G#dim7' &&
                aMin[8].roman7 === 'vii°7';
  if (sevOk) pass++;
  lines.push((sevOk ? 'pass' : 'FAIL') + '  diatonic sevenths, half vs fully diminished');

  /* Chord names the parser used to choke on or mis-render. */
  const figCases = [['C6/9', 'C E G A D', '6/9'], ['G7sus4', 'G C D F', '7sus4'],
                    ['Cmaj9', 'C E G B D', 'maj9'], ['Cm7b5', 'C Eb Gb Bb', 'ø7']];
  const figOk = figCases.every(([txt, notes, fig]) => {
    const c = parseChord(txt);
    return c && !c.error && chordNoteNames(c).join(' ') === notes && chordFigure(c) === fig;
  });
  if (figOk) pass++;
  lines.push((figOk ? 'pass' : 'FAIL') + '  chord spelling and figures');

  /* Inversions must read off the bass, and a bass outside the chord is not one. */
  const invOk = romanAnalysis([parseChord('C/E')], 0, 'major')[0].roman === 'I⁶' &&
                romanAnalysis([parseChord('G7/F')], 0, 'major')[0].roman === 'V7⁴₂' &&
                romanAnalysis([parseChord('C/G')], 0, 'major')[0].roman === 'I⁶₄' &&
                inversionOf(parseChord('C/D')).figure === null;
  if (invOk) pass++;
  lines.push((invOk ? 'pass' : 'FAIL') + '  figured-bass inversions');

  /* A cadence needs the right pair in the right place. */
  const cadOf = (s) => { const r = analyze(s); return r.cadences.map(c => c.name).join('|'); };
  const cadOk = cadOf('Dm G C') === 'perfect, prepared by ii' &&
                cadOf('C F C')  === 'plagal' &&
                cadOf('C G Am') === 'interrupted' &&
                cadOf('C Dm G') === 'half' &&
                cadOf('Am Dm E') === 'Phrygian half';
  if (cadOk) pass++;
  lines.push((cadOk ? 'pass' : 'FAIL') + '  cadences named');

  /* A mode is claimed only when the plain major or minor cannot account for the
     notes — and never for music that is simply diatonic. */
  const modOf = (s) => { const r = analyze(s); return r.modal ? r.modal.name : null; };
  const modOk = modOf('G F C G') === 'G Mixolydian' &&
                modOf('Am D G Am') === 'A Dorian' &&
                modOf('C G Am F') === null &&
                modOf('Am Dm E7 Am') === null;
  if (modOk) pass++;
  lines.push((modOk ? 'pass' : 'FAIL') + '  modal reading');

  /* A scale is its gaps. The harmonic minor's augmented second is the one step
     wider than a tone anywhere in the four patterns. */
  const pats = {}, patNotes = {};
  scalePatterns('C').forEach(p => {
    pats[p.name] = p.steps.join(' ');
    patNotes[p.name] = p.notes.join(' ');
  });
  const ebMaj = scaleSteps('Eb', MAJOR_SCALE);
  const stepOk = pats['major']          === 'T T ½ T T T ½' &&
                 pats['natural minor']  === 'T ½ T T ½ T T' &&
                 pats['harmonic minor'] === 'T ½ T T ½ 1½ ½' &&
                 pats['melodic minor']  === 'T ½ T T T T ½' &&
                 ebMaj.notes.join(' ') === 'Eb F G Ab Bb C D Eb' &&
                 ebMaj.steps.length === 7 &&
                 /* Every pattern spelled from the same tonic, one letter per
                    degree: the harmonic minor keeps Ab and raises to B, it does
                    not become G#. */
                 patNotes['major']          === 'C D E F G A B' &&
                 patNotes['natural minor']  === 'C D Eb F G Ab Bb' &&
                 patNotes['harmonic minor'] === 'C D Eb F G Ab B' &&
                 patNotes['melodic minor']  === 'C D Eb F G A B';
  if (stepOk) pass++;
  lines.push((stepOk ? 'pass' : 'FAIL') + '  scale step patterns');

  /* The signature belongs to the relative major, not the letter of the tonic. */
  const sigOk = keySignature(3, 'minor').text === '6 flats' &&
                keySignature(10, 'major').notes.join(' ') === 'Bb Eb' &&
                keySignature(0, 'major').count === 0;
  if (sigOk) pass++;
  lines.push((sigOk ? 'pass' : 'FAIL') + '  key signatures');

  report(lines, pass, cases.length + 9);
  return pass === cases.length + 9;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { analyze, keyName, shortKeyName, selfTest, parseChord, chordNoteNames, transposeChord,
                     spellScale, keySignature, diatonicChords, harmonicFunctions,
                     circleOfFifths, describe, modesOfKey, MODE_BRIGHTNESS,
                     cadences, modalReading, inversionOf, chordFigure,
                     scaleSteps, scalePatterns };
}
</script>

<script>
/* =========================================================================
   UI LAYER — talks to analyze() and nothing else.
   ========================================================================= */
(function () {
  const $ = (id) => document.getElementById(id);
  const input = $('chords'), capoIn = $('capo');
  const chipbox = $('chips'), chipslabel = $('chips-label');
  const errbox = $('parse-error'), out = $('result');

  function capoValue() {
    const n = parseInt(capoIn.value, 10);
    return Number.isFinite(n) && n > 0 ? Math.min(n, 11) : 0;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

  function renderChips(parsed, capo) {
    chipbox.innerHTML = '';
    const errors = [];
    parsed.forEach(p => {
      const el = document.createElement('span');
      el.className = 'chip' + (p.error ? ' bad' : '');
      if (p.error) {
        el.innerHTML = '<b>' + esc(p.raw) + '</b> ?';
        errors.push(p.raw + ' — ' + p.error);
      } else if (capo) {
        /* Shape you finger → chord that actually sounds. */
        el.innerHTML = '<b>' + esc(p.raw) + '</b>' +
                       '<span class="to"> → </span>' +
                       '<span class="sounds">' + esc(p.sounding.raw) + '</span> ' +
                       esc(chordNoteNames(p.sounding).join(' '));
      } else {
        el.innerHTML = '<b>' + esc(p.raw) + '</b> ' + esc(chordNoteNames(p).join(' '));
      }
      chipbox.appendChild(el);
    });
    chipslabel.hidden = !parsed.length;
    chipslabel.textContent = capo
      ? 'How each chord was read'
      : 'How each chord was read, and the notes it contains';

    errbox.hidden = !errors.length;
    errbox.textContent = errors.join('  ·  ');
  }

  /* Polar layout: spoke 0 (C) points straight up, then clockwise by fifths.
     Three bands, outside in: majors 134–182, relative minors 92–134, the
     diminished sevenths 34–92. The innermost band is the widest because at that
     radius a degree numeral laid along a horizontal spoke is nearly as long as
     the band is deep. */
  const DEGREES = {
    major: { outer: ['IV', 'I', 'V'],    inner: ['ii', 'vi', 'iii'] },
    minor: { outer: ['VI', 'III', 'VII'], inner: ['iv', 'i', 'v'] }
  };

  function circleSvg(t) {
    const CX = 190, CY = 190;
    const R_RIM = 182, R_DIV1 = 134, R_DIV2 = 92, R_HUB = 34;
    const R_MAJ = 164, R_MAJ_DEG = 140;
    const R_MIN = 117, R_MIN_DEG = 97;
    const R_DIM = 77,  R_DIM_DEG = 53;

    const at = (deg, rad) => {
      const a = (deg - 90) * Math.PI / 180;
      return [CX + rad * Math.cos(a), CY + rad * Math.sin(a)];
    };
    const n = (v) => Math.round(v * 10) / 10;

    /* A spoke with two names stacks them; the pair is one key, so the highlight
       covers both lines. */
    const label = (cls, x, y, name, alt, on, inKey) => {
      const c = cls + (on ? ' on' : (inKey ? ' in' : ''));
      const open = '<text class="' + c + '" x="' + n(x) + '" y="' + n(y) + '">';
      if (!alt) return open + esc(name) + '</text>';
      return open +
        '<tspan x="' + n(x) + '" dy="-0.5em">' + esc(name) + '</tspan>' +
        '<tspan class="alt" x="' + n(x) + '" dy="1.05em">' + esc(alt) + '</tspan>' +
        '</text>';
    };

    /* A key's chords are not a plain sector. Three spokes wide across the major
       and minor rings, but only one spoke deep into the diminished ring: the two
       diminished chords flanking the vii° share those spokes without being in the
       scale, so the shape steps in around them. */
    const wedge = (centerDeg) => {
      const a = [centerDeg - 45, centerDeg - 15, centerDeg + 15, centerDeg + 45];
      const pt = (i, rad) => { const [x, y] = at(a[i], rad); return n(x) + ' ' + n(y); };
      const A = (rad, sweep, i) => 'A' + rad + ' ' + rad + ' 0 0 ' + sweep + ' ' + pt(i, rad);
      return 'M' + pt(0, R_RIM) +
             A(R_RIM, 1, 3) +                        // round the rim, clockwise
             'L' + pt(3, R_DIV2) + A(R_DIV2, 0, 2) + // back along the minors' inner edge
             'L' + pt(2, R_HUB)  + A(R_HUB,  0, 1) + // the one-spoke tab for the vii°
             'L' + pt(1, R_DIV2) + A(R_DIV2, 0, 0) + 'Z';
    };

    const spokes = circleOfFifths();
    /* Every chord in a key sits on three neighbouring spokes: the tonic between
       its subdominant and its dominant. Majors ride the outer ring, their
       relative minors the inner one — six chords, one contiguous wedge. */
    const home = spokes.findIndex(sp =>
      t.mode === 'major' ? sp.majorPc === t.tonic : sp.minorPc === t.tonic);
    const degs = DEGREES[t.mode];

    /* Parallel key: same tonic, opposite mode — C major and C minor. It sits
       three spokes away, which is exactly why swapping to it changes the key
       signature by three accidentals. */
    const parallel = spokes.findIndex(sp =>
      t.mode === 'major' ? sp.minorPc === t.tonic : sp.majorPc === t.tonic);
    const parDegs = DEGREES[t.mode === 'major' ? 'minor' : 'major'];

    /* Which spokes' diminished chords the key actually uses. In a major key that
       is the one vii° on the tonic spoke; in a minor key it is ii° on the tonic
       spoke plus the raised vii°, which lands on the parallel major's spoke —
       another way of seeing that the raised seventh is borrowed. */
    const dimRoman = (tonic, mode) => {
      const m = new Map();
      diatonicChords(tonic, mode)
        .filter(d => /dim/.test(d.name))
        .forEach(d => {
          const i = spokes.findIndex(sp => sp.dimPc === d.rootPc);
          if (i >= 0) m.set(i, d.roman);
        });
      return m;
    };
    const dimAt = dimRoman(t.tonic, t.mode);
    const dimPar = dimRoman(t.tonic, t.mode === 'major' ? 'minor' : 'major');

    let g = '<path class="region" d="' + wedge(home * 30) + '"/>' +
            '<circle class="ring" cx="' + CX + '" cy="' + CY + '" r="' + R_RIM + '"/>' +
            '<circle class="ring" cx="' + CX + '" cy="' + CY + '" r="' + R_DIV1 + '"/>' +
            '<circle class="ring" cx="' + CX + '" cy="' + CY + '" r="' + R_DIV2 + '"/>' +
            '<circle class="ring" cx="' + CX + '" cy="' + CY + '" r="' + R_HUB + '"/>';

    for (let i = 0; i < 12; i++) {
      const [x1, y1] = at(i * 30 + 15, R_HUB), [x2, y2] = at(i * 30 + 15, R_RIM);
      g += '<line class="spoke" x1="' + n(x1) + '" y1="' + n(y1) +
           '" x2="' + n(x2) + '" y2="' + n(y2) + '"/>';
    }

    /* After the spokes, not before them. The parallel wedge's straight edges lie
       exactly along two spokes, so drawn first its dashes are painted over by
       them and only the curved parts of the outline survive. */
    g += '<path class="region-outline" d="' + wedge(parallel * 30) + '"/>';

    spokes.forEach((sp, i) => {
      const [mx, my] = at(sp.angle, R_MAJ);
      const [ix, iy] = at(sp.angle, R_MIN);
      const [dmx, dmy] = at(sp.angle, R_DIM);
      const majOn = t.mode === 'major' && i === home;
      const minOn = t.mode === 'minor' && i === home;

      /* Subdominant, tonic, dominant — the only three spokes the key uses. */
      const off = mod12(i - home);
      const slot = off === 11 ? 0 : (off === 0 ? 1 : (off === 1 ? 2 : -1));
      const lit = slot >= 0;

      if (majOn) g += '<circle class="mark" cx="' + n(mx) + '" cy="' + n(my) +
                      '" r="' + (sp.majorAlt ? 19 : 17) + '"/>';
      if (minOn) g += '<circle class="mark" cx="' + n(ix) + '" cy="' + n(iy) +
                      '" r="' + (sp.minorAlt ? 17 : 15) + '"/>';

      if (i === parallel) {
        const [px, py] = t.mode === 'major' ? [ix, iy] : [mx, my];
        const alt = t.mode === 'major' ? sp.minorAlt : sp.majorAlt;
        const rad = t.mode === 'major' ? (alt ? 17 : 15) : (alt ? 19 : 17);
        g += '<circle class="mark parallel" cx="' + n(px) + '" cy="' + n(py) +
             '" r="' + rad + '"/>';
      }

      g += label('maj', mx, my, sp.major, sp.majorAlt, majOn, lit);
      g += label('min', ix, iy, sp.minor, sp.minorAlt, minOn, lit);
      g += label('dim', dmx, dmy, sp.dim, sp.dimAlt, false, dimAt.has(i));

      /* The diminished degree, on the ring it belongs to. Only the spokes whose
         diminished chord the key really contains are numbered — the other two in
         the wedge share the spoke without sharing the chord. */
      if (dimAt.has(i) || dimPar.has(i)) {
        const own = dimAt.has(i);
        const [px, py] = at(sp.angle, R_DIM_DEG);
        g += '<text class="deg' + (own ? '' : ' par') + '" x="' + n(px) + '" y="' + n(py) + '">' +
             esc(own ? dimAt.get(i) : dimPar.get(i)) + '</text>';
      }

      if (lit) {
        const [dx, dy] = at(sp.angle, R_MAJ_DEG);
        const [ex, ey] = at(sp.angle, R_MIN_DEG);
        g += '<text class="deg" x="' + n(dx) + '" y="' + n(dy) + '">' +
             esc(degs.outer[slot]) + '</text>';
        g += '<text class="deg" x="' + n(ex) + '" y="' + n(ey) + '">' +
             esc(degs.inner[slot]) + '</text>';
      }

      /* Same three-spoke shape, read in the parallel key. The two wedges never
         overlap — they sit three spokes apart — so the degrees cannot collide. */
      const poff = mod12(i - parallel);
      const pslot = poff === 11 ? 0 : (poff === 0 ? 1 : (poff === 1 ? 2 : -1));
      if (pslot >= 0) {
        const [dx, dy] = at(sp.angle, R_MAJ_DEG);
        const [ex, ey] = at(sp.angle, R_MIN_DEG);
        g += '<text class="deg par" x="' + n(dx) + '" y="' + n(dy) + '">' +
             esc(parDegs.outer[pslot]) + '</text>';
        g += '<text class="deg par" x="' + n(ex) + '" y="' + n(ey) + '">' +
             esc(parDegs.inner[pslot]) + '</text>';
      }
    });

    return '<svg class="cof" viewBox="0 0 380 380" role="img" aria-label="Circle of fifths in ' +
           'three rings — major keys, relative minors, diminished sevenths. ' +
           esc(keyName(t.tonic, t.mode)) + ' and its diatonic chords are highlighted ' +
           'with their scale degrees">' + g + '</svg>';
  }

  function render(base) {
    if (!base.ok) { out.innerHTML = ''; return; }
    /* A key the user picked overrides the detected one for the whole readout. */
    const r = chosen ? Object.assign({}, base, describe(base, chosen.tonic, chosen.mode)) : base;
    const t = r.top;
    const pct = Math.round(t.confidence * 100);
    const word = confidenceWord(t.confidence, r.ambiguous);
    const relTonic = t.mode === 'major' ? mod12(t.tonic + 9) : mod12(t.tonic + 3);
    const relMode = t.mode === 'major' ? 'minor' : 'major';
    const sig = keySignature(t.tonic, t.mode);
    const alts = r.candidates.filter(c => c !== t).slice(0, 4).map(c =>
      '<li><button type="button" data-tonic="' + c.tonic + '" data-mode="' + c.mode +
        '" title="' + esc(keyName(c.tonic, c.mode)) + '">' +
        '<span class="nm">' + esc(shortKeyName(c.tonic, c.mode)) + '</span>' +
        '<span class="pct">' + Math.round(c.confidence * 100) + '%</span>' +
        (c === r.candidates[0] ? '<span class="tag">detected</span>' : '') +
      '</button></li>').join('');

    const grades = diatonicChords(t.tonic, t.mode).map(d =>
      '<div class="dc' + (d.extra ? ' extra' : '') + '">' +
        '<span class="num">' + esc(d.roman) + '</span>' +
        '<span class="nm">' + esc(d.name) + '</span>' +
        '<span class="sev">' + esc(d.name7) + '</span>' +
      '</div>').join('');

    /* The key's own scale, then the four patterns behind it. The current one is
       marked, so the concrete row above and the abstract row below are visibly
       the same thing. */
    const keyRoot = (t.mode === 'major' ? MAJOR_KEY_NAMES : MINOR_KEY_NAMES)[t.tonic];
    const sc = scaleSteps(keyRoot, t.mode === 'major' ? MAJOR_SCALE : NAT_MINOR);
    const stepRow = sc.notes.map((nm, i) =>
      '<span class="n">' + esc(nm) + '</span>' +
      (i < sc.steps.length ? '<span class="s">' + esc(sc.steps[i]) + '</span>' : '')).join('');
    const ownPattern = t.mode === 'major' ? 'major' : 'natural minor';
    const patterns = scalePatterns(keyRoot).map(p =>
      '<tr' + (p.name === ownPattern ? ' class="own"' : '') + '>' +
        '<td>' + esc(p.name) + '</td>' +
        '<td class="pat">' +
          p.steps.map(s => '<span>' + esc(s) + '</span>').join('') + '</td>' +
        '<td class="sym">' + esc(p.notes.join(' ')) + '</td>' +
      '</tr>').join('');

    const cads = r.cadences.map(c =>
      '<li><span class="move">' + esc(c.from) + ' → ' + esc(c.to) + '</span>' +
        ' — <span class="kind">' + esc(c.name) + '</span>' +
        ' <span class="gloss">· ' + esc(c.gloss) + '</span></li>').join('');

    const funcs = harmonicFunctions(t.tonic, t.mode).map(g =>
      '<tr><td>' + esc(g.name) + '</td>' +
      '<td class="rn">' + esc(g.chords.map(c => c.roman).join('  ')) + '</td>' +
      '<td class="sym">' + esc(g.chords.map(c => c.name).join('  ')) + '</td></tr>').join('');

    const modes = modesOfKey(t.tonic, t.mode).map((m, i) =>
      '<tr' + (i === 0 ? ' class="tonic"' : '') + '>' +
        '<td class="sym">' + esc(m.root) + '</td>' +
        '<td>' + esc(m.mode) + '</td>' +
        '<td class="sym">' + esc(m.colour || '—') + '</td>' +
        '<td class="sym">' + esc(m.notes.join(' ')) + '</td>' +
      '</tr>').join('');

    /* Each chip a shade brighter than the last, so the ordering is visible and
       not merely asserted. */
    const ownMode = t.mode === 'major' ? 'Ionian' : 'Aeolian';
    const bright = MODE_BRIGHTNESS.map((m, i) => {
      const own = m === ownMode;
      return '<li class="' + (own ? 'own' : '') + '" style="opacity:' +
             (own ? '1' : (0.4 + i * 0.09).toFixed(2)) + '">' + esc(m) + '</li>';
    }).join('');

    const rows = r.romans.map(x =>
      '<tr><td class="sym">' + esc(x.chord.raw) + '</td>' +
      '<td class="rn">' + esc(x.roman) + '</td>' +
      '<td class="' + (x.outside ? 'out' : '') + '">' + esc(x.note) + '</td></tr>').join('');

    out.innerHTML =
      '<div class="answer">' +
        '<p class="keyname">' + esc(keyName(t.tonic, t.mode)) + '</p>' +
        '<p class="relative">' + esc(sig.notes.length ? sig.text + ' — ' + sig.notes.join(' ')
                                                     : sig.text) + '</p>' +
        '<p class="relative">relative ' + relMode + ': ' + esc(keyName(relTonic, relMode)) + '</p>' +
        /* Only when the notes played spell a mode that the plain major or minor
           cannot account for — otherwise the key name already said it. */
        (r.modal
          ? '<p class="relative">these notes spell <b>' + esc(r.modal.name) + '</b>' +
            (r.modal.colour ? ' — ' + esc(r.modal.colour) : '') +
            ' · ' + esc(r.modal.signature.text) + '</p>'
          : '') +
        (r.capo
          ? '<p class="relative">capo ' + r.capo + ' — you are fingering ' +
            esc(keyName(mod12(t.tonic - r.capo), t.mode)) + ' shapes</p>'
          : '') +
        (r.picked ? '<p class="relative">your pick — the evidence points to ' +
                    esc(keyName(base.top.tonic, base.top.mode)) + '</p>' : '') +
        '<div class="conf">' +
          '<p class="conf-text"><b>' + pct + '%</b> — ' + word + '</p>' +
        '</div>' +
        '<p class="why' + (r.ambiguous ? ' ambiguous' : '') + '">' + esc(r.explanation) + '</p>' +
        '<p class="alts-label">Possible keys</p>' +
        '<ul class="alts">' + alts + '</ul>' +
        '<div class="details">' +
          '<h2>Circle of fifths</h2>' +
          circleSvg(t) +
          '<details class="fold">' +
            '<summary>Summary</summary>' +
            '<ul class="legend">' +
              '<li><b>Shaded wedge</b> — the seven chords in the key.</li>' +
              '<li><b>One step round</b> — subdominant anticlockwise, dominant clockwise.</li>' +
              '<li><b>Middle ring</b> — each major\'s relative minor.</li>' +
              '<li><b>Inner ring</b> — the diminished chord both share: the major\'s ' +
                'vii°, the minor\'s ii°.</li>' +
              '<li><b>Dashed wedge</b> — the parallel key and its degrees, to borrow from.</li>' +
            '</ul>' +
          '</details>' +
          '<h2>How each chord functions</h2>' +
          '<div class="tablewrap"><table>' +
            '<thead><tr><th>Chord</th><th>Function</th><th>Origin</th></tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table></div>' +
          (cads
            ? '<h2>Cadences</h2>' +
              '<ul class="cadences">' + cads + '</ul>'
            : '') +
          '<h2>Chords in this key</h2>' +
          '<div class="grades">' + grades + '</div>' +
          (t.mode === 'minor'
            ? '<p class="legend">The dashed pair raise the seventh degree. They come from the ' +
              'harmonic minor, and they are how a minor key gets a true dominant — and the ' +
              'only place a full diminished seventh belongs.</p>'
            : '') +
          '<h2>Scale steps</h2>' +
          '<div class="steps">' + stepRow + '</div>' +
          '<div class="tablewrap"><table class="patterns">' +
            '<tbody>' + patterns + '</tbody>' +
          '</table></div>' +
          (t.mode === 'minor'
            ? '<p class="legend">The harmonic minor\'s 1½ is an augmented second, the ' +
              'outsized gap between its flat sixth and raised seventh. That step is the ' +
              'sound of the mode.</p>'
            : '') +
          '<h2>Harmonic function</h2>' +
          '<div class="tablewrap"><table>' +
            '<thead><tr><th>Function</th><th>Degrees</th><th>Chords</th></tr></thead>' +
            '<tbody>' + funcs + '</tbody>' +
          '</table></div>' +
          '<p class="legend">Subdominant chords lead away from the tonic, dominant chords ' +
            'pull back to it. That tension and release is what makes a key feel like a key.</p>' +
          '<h2>Modes</h2>' +
          '<div class="tablewrap"><table>' +
            '<thead><tr><th>Root</th><th>Mode</th><th>Colour</th><th>Notes</th></tr></thead>' +
            '<tbody>' + modes + '</tbody>' +
          '</table></div>' +
          '<p class="legend">The colour is the one degree that names the mode — the bright ' +
            'modes heard against the major scale, the dark ones against the natural minor. ' +
            'Ionian and Aeolian are those two references, so they have none.</p>' +
          '<p class="legend">Darker to brighter</p>' +
          '<ul class="bright">' + bright + '</ul>' +
        '</div>' +
      '</div>';
  }

  /* Picking an alternative key re-reads the whole page against it; changing the
     chords or the capo hands the choice back to the analysis. */
  /* Theme: no stored choice means follow the system. Once the reader picks, the
     choice sticks and overrides the system in both directions. */
  const THEME_KEY = 'fifthtonic-theme';
  const themeBtn = $('theme');
  /* A ring, one half hollow and one half filled. */
  const ICON =
    '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/>' +
      '<path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>' +
    '</svg>';

  function activeTheme() {
    return document.documentElement.getAttribute('data-theme') ||
           (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }

  function paintThemeButton() {
    const now = activeTheme();
    const next = now === 'dark' ? 'light' : 'dark';
    if (!themeBtn.firstChild) themeBtn.innerHTML = ICON;
    themeBtn.classList.toggle('is-dark', now === 'dark');
    themeBtn.setAttribute('aria-label', 'Switch to ' + next + ' mode');
    themeBtn.title = 'Switch to ' + next + ' mode';
  }

  themeBtn.addEventListener('click', () => {
    const next = activeTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    paintThemeButton();
  });

  /* While still on the system default, follow it if the system flips. */
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!document.documentElement.getAttribute('data-theme')) paintThemeButton();
  });

  paintThemeButton();

  let chosen = null, latest = null;

  out.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tonic]');
    if (!b || !latest) return;
    chosen = { tonic: Number(b.dataset.tonic), mode: b.dataset.mode };
    render(latest);
  });

  function run() {
    chosen = null;
    latest = analyze(input.value, capoValue());
    renderChips(latest.parsed, latest.capo);
    render(latest);
  }

  let timer;
  const debounced = () => { clearTimeout(timer); timer = setTimeout(run, 200); };
  input.addEventListener('input', debounced);
  capoIn.addEventListener('input', debounced);

  run();

  selfTest((lines, pass, total) => {
    console.group('Fifthtonic self-test — ' + pass + '/' + total);
    lines.forEach(l => (l.startsWith('FAIL') ? console.error(l) : console.log(l)));
    console.groupEnd();
  });
})();
</script>
</body>
</html>
